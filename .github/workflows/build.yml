name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Calisthenics.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Calisthenics-apk
          path: Calisthenics.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Calisthenics.apk \
            --title "Калистеника, сборка ${{ github.run_number }}" \
            --notes "APK для установки на Android. Коммит ${{ github.sha }}." \
            --latest
